<table class="records">
  <tr><th colspan="{% if graded %}7{% else %}5{% endif %}">{{ title }}</th></tr>
  <tr>
    <th>#</th><th>Runner</th>{% if graded %}<th>Grade</th>{% endif %}<th>Time</th><th>Year</th><th>Age</th>{% if graded %}<th>Sex</th>{% endif %}
  </tr>
  {% for r in rows %}
  <tr>
    <td class="num">{{ r.rank }}</td><td>{{ r.runner }}</td>{% if graded %}<td class="num">{{ r.grade }}</td>{% endif %}
    <td class="num">{{ r.time }}</td><td class="num">{{ r.year }}</td><td class="num">{{ r.age }}</td>{% if graded %}<td>{{ r.gender }}</td>{% endif %}
  </tr>
  {% empty %}
  <tr><td colspan="5">No results</td></tr>
  {% endfor %}
</table>
